<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell Line Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1EA;
    --raised:#F8FAF5;
    --ink:#1C2620;
    --soft:#4B5850;
    --line:#C9D0C2;
    --amber:#B4661F;
    --teal:#3F6E63;
    --teal-soft:#DEE9E4;
  }
  *{box-sizing:border-box;}
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }

  header{
    padding:38px 32px 24px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:24px; flex-wrap:wrap;
  }
  header h1{ margin:0; font-size:29px; font-weight:600; letter-spacing:-0.012em; }
  header p{ margin:7px 0 0; color:var(--soft); font-size:14.5px; max-width:58ch; line-height:1.5; }
  .tally{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--soft); text-align:right; }
  .tally strong{ display:block; font-size:30px; color:var(--ink); font-weight:600; line-height:1.1; }

  .toolbar{
    position:sticky; top:0; z-index:5; background:var(--paper);
    padding:15px 32px; border-bottom:1px solid var(--line);
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  }
  #search{
    flex:1; min-width:230px; padding:10px 13px;
    border:1px solid var(--line); background:var(--raised); border-radius:3px;
    font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink); outline:none;
  }
  #search:focus{ border-color:var(--teal); }
  #search::placeholder{ color:#8E978E; }
  .tabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .tab{
    padding:8px 13px; border:1px solid var(--line); border-radius:3px;
    background:var(--raised); font-family:'IBM Plex Mono',monospace;
    font-size:12px; cursor:pointer; color:var(--soft); white-space:nowrap;
  }
  .tab:hover{ border-color:var(--teal); color:var(--ink); }
  .tab.on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  main{ padding:26px 32px 64px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:16px; }

  .card{
    background:var(--raised); border:1px solid var(--line); border-radius:4px;
    padding:14px 15px 12px; cursor:pointer; display:flex; flex-direction:column;
    transition:border-color .12s ease;
  }
  .card:hover{ border-color:var(--teal); }
  .card:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  .pos{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    color:var(--amber); font-weight:600; letter-spacing:.04em;
  }
  .card .name{ font-size:15px; line-height:1.32; font-weight:600; margin:8px 0 4px; }
  .card .organism{ font-size:12.5px; color:var(--soft); margin-bottom:9px; line-height:1.4; }
  .card .tissue{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--teal);
    background:var(--teal-soft); display:inline-block; padding:3px 7px; border-radius:3px;
    margin-bottom:10px; align-self:flex-start;
  }
  .card .meta{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--soft);
    display:flex; justify-content:space-between; gap:8px;
    border-top:1px solid var(--line); padding-top:8px; margin-top:auto;
  }
  .card .meta span:last-child{ text-align:right; }

  .empty{
    padding:80px 20px; text-align:center; color:var(--soft);
    font-family:'IBM Plex Mono',monospace; font-size:13.5px;
  }

  .overlay{
    position:absolute; inset:0; background:rgba(20,26,22,.55);
    display:none; z-index:50;
  }
  .overlay.on{ display:block; }
  .modal{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:var(--raised); border:1px solid var(--line); border-radius:6px;
    max-width:620px; width:calc(100% - 48px); max-height:88vh; overflow-y:auto;
  }
  .mhead{ display:flex; justify-content:space-between; align-items:flex-start; padding:19px 22px 0; }
  .mclose{ background:none; border:none; font-size:22px; color:var(--soft); cursor:pointer; line-height:1; padding:0 4px; }
  .mclose:hover{ color:var(--ink); }
  .modal h2{ margin:6px 22px 3px; font-size:20px; font-weight:600; line-height:1.28; }
  .modal .organism{ margin:0 22px 16px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--soft); }
  .details{ padding:0 22px 22px; display:grid; grid-template-columns:1fr 1fr; gap:13px 20px; }
  .details label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:10px;
    letter-spacing:.06em; color:var(--soft); margin-bottom:3px; text-transform:uppercase;
  }
  .details span{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  .details a{ color:var(--teal); text-decoration:none; border-bottom:1px solid var(--teal); }
  .details a:hover{ color:var(--amber); border-color:var(--amber); }
  .wide{ grid-column:1/-1; }
  .wide span{ display:block; background:var(--teal-soft); padding:10px 12px; border-radius:3px; font-size:12.5px; line-height:1.55; font-family:'Source Serif 4',serif; }

  @media (max-width:640px){
    header,.toolbar,main{ padding-left:18px; padding-right:18px; }
    .details{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Cell Line Inventory</h1>
    <p>ATCC cell lines ordered for the LNP delivery programs, grouped by project. Select a card for the full record.</p>
  </div>
  <div class="tally">showing<strong id="tally">0</strong>of 0</div>
</header>

<div class="toolbar">
  <input type="text" id="search" placeholder="search name, catalog #, organism, tissue, feature..." autocomplete="off">
  <div class="tabs" id="tabs"></div>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>nothing matches that search</div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<script>
const DATA = {DATA_PLACEHOLDER};

const programs = ['All', ...[...new Set(DATA.map(d=>d.program))].sort()];
let activeProgram='All', query='';

const tabsEl=document.getElementById('tabs');
const gridEl=document.getElementById('grid');
const emptyEl=document.getElementById('empty');
const tallyEl=document.getElementById('tally');
const overlay=document.getElementById('overlay');
const modal=document.getElementById('modal');

function shortProgram(p){ return p.replace(/^\d+\s*-\s*/,''); }

programs.forEach(p=>{
  const t=document.createElement('button');
  t.className='tab'+(p==='All'?' on':'');
  t.textContent = p==='All' ? 'All' : shortProgram(p);
  t.dataset.program=p;
  t.onclick=()=>{ activeProgram=p; [...tabsEl.children].forEach(x=>x.classList.toggle('on',x.dataset.program===p)); render(); };
  tabsEl.appendChild(t);
});

document.getElementById('search').addEventListener('input',e=>{
  query=e.target.value.trim().toLowerCase(); render();
});

function hit(d){
  if(activeProgram!=='All' && d.program!==activeProgram) return false;
  if(!query) return true;
  return [d.name,d.cat,d.organism,d.tissue,d.feature].join(' ').toLowerCase().includes(query);
}

function render(){
  const rows=DATA.filter(hit);
  tallyEl.textContent=rows.length;
  emptyEl.hidden=rows.length>0;
  gridEl.replaceChildren();

  rows.forEach(d=>{
    const card=document.createElement('div');
    card.className='card';
    card.tabIndex=0;
    card.onclick=()=>open(d);
    card.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(d); } };

    const pos=document.createElement('div');
    pos.className='pos';
    pos.textContent='C-'+String(d.num).padStart(2,'0');
    card.appendChild(pos);

    const nm=document.createElement('div');
    nm.className='name';
    nm.textContent=d.name;
    card.appendChild(nm);

    const org=document.createElement('div');
    org.className='organism';
    org.textContent=d.organism;
    card.appendChild(org);

    const tis=document.createElement('div');
    tis.className='tissue';
    tis.textContent=d.tissue;
    card.appendChild(tis);

    const meta=document.createElement('div');
    meta.className='meta';
    const c=document.createElement('span'); c.textContent=d.cat;
    const q=document.createElement('span'); q.textContent='qty '+d.qty;
    meta.append(c,q);
    card.appendChild(meta);

    gridEl.appendChild(card);
  });
}

function open(d){
  modal.replaceChildren();

  const head=document.createElement('div');
  head.className='mhead';
  const p=document.createElement('span');
  p.className='pos';
  p.textContent='C-'+String(d.num).padStart(2,'0')+' · '+shortProgram(d.program);
  const x=document.createElement('button');
  x.className='mclose'; x.textContent='×'; x.setAttribute('aria-label','Close');
  x.onclick=close;
  head.append(p,x);
  modal.appendChild(head);

  const h=document.createElement('h2'); h.textContent=d.name; modal.appendChild(h);
  const org=document.createElement('div'); org.className='organism'; org.textContent=d.organism; modal.appendChild(org);

  const det=document.createElement('div');
  det.className='details';

  const catCell=document.createElement('div');
  const catLabel=document.createElement('label'); catLabel.textContent='ATCC Catalog #';
  const catValue=document.createElement('span');
  if(d.link){
    const a=document.createElement('a'); a.href=d.link; a.target='_blank'; a.rel='noopener noreferrer'; a.textContent=d.cat;
    catValue.appendChild(a);
  } else {
    catValue.textContent=d.cat;
  }
  catCell.append(catLabel,catValue); det.appendChild(catCell);

  [['Tissue / Disease',d.tissue],['Key Feature / Marker',d.feature],['Recommended Medium',d.medium],
   ['Qty',d.qty],['Unit Price',d.price],['Line Total',d.total]].forEach(([k,v])=>{
    const cell=document.createElement('div');
    const l=document.createElement('label'); l.textContent=k;
    const s=document.createElement('span'); s.textContent=v;
    cell.append(l,s); det.appendChild(cell);
  });

  const role=document.createElement('div');
  role.className='wide';
  const rl=document.createElement('label'); rl.textContent='Role in Project';
  const rs=document.createElement('span'); rs.textContent=d.role;
  role.append(rl,rs); det.appendChild(role);

  modal.appendChild(det);

  overlay.classList.add('on');
  placeModal();
  x.focus();
}

// The component iframe is stretched to its full content height (see reportHeight),
// so position:fixed resolves against the top of the whole card list, not the part
// of the page in view. Center the modal in the band that is actually visible.
function placeModal(){
  let vh, top;
  try{
    const fe = window.frameElement;
    const r = fe.getBoundingClientRect();
    const visTop = Math.max(0, -r.top);
    const visBottom = Math.min(fe.clientHeight, window.parent.innerHeight - r.top);
    vh = Math.max(160, visBottom - visTop);
    top = window.scrollY + visTop + vh/2;
  }catch(e){
    vh = window.innerHeight;
    top = window.scrollY + vh/2;
  }
  modal.style.top = top + 'px';
  modal.style.maxHeight = (vh - 48) + 'px';
}

function close(){ overlay.classList.remove('on'); }
overlay.onclick=e=>{ if(e.target===overlay) close(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
['scroll','resize'].forEach(ev=>{
  try{ window.parent.addEventListener(ev,()=>{ if(overlay.classList.contains('on')) placeModal(); },{passive:true}); }catch(e){}
});

render();

function reportHeight(){
  const h = document.documentElement.scrollHeight;
  try {
    const fe = window.frameElement;
    if (fe){ fe.style.height = h + 'px'; fe.setAttribute('height', h); }
  } catch(e){}
  window.parent.postMessage({type:'streamlit:setFrameHeight', height:h}, '*');
}
new ResizeObserver(reportHeight).observe(document.body);
window.addEventListener('load', reportHeight);
reportHeight();
</script>
</body>
</html>
